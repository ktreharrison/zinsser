[package]
name = "zinsser"
version = "0.1.0"
edition = "2021"
description = "Local-first prose linter and structural cadence engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ktreharrison/zinsser"
keywords = ["linter", "prose", "markdown", "writing", "vale"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
harper-core = "0.16"
pulldown-cmark = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
anyhow = "1.0"
regex = "1.10"

[package]
name = "zinsser"
version = "0.2.0"
edition = "2021"
description = "Local-first prose linter and structural cadence engine"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ktreharrison/zinsser"
keywords = ["linter", "prose", "markdown", "writing", "vale"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
harper-core = { version = "3.2", default-features = false, features = ["concurrent"] }  # thesaurus off: 4.5 MB, no change in findings
pulldown-cmark = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
anyhow = "1.0"
regex = "1.10"
# Brill POS tagger (contextual verb detection); embeds its trained model, no
# network. harper-core 3 already depends on harper-brill, so making it
# optional here only switches verb detection; it does not shrink the build.
harper-brill = { version = "3", optional = true }
yaml-rust2 = "0.13"

[features]
default = ["pos-tagger"]
# Context-aware verb detection. Without it, delayed-verb checks use the
# dictionary and wordlist fallback only.
pos-tagger = ["dep:harper-brill"]

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
